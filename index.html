<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn Japanese for beginners. Explore our interactive Hiragana/Katakana charts, roadmap guide, and JLPT N5, N4, and N3 levels with cards, grammar rules, and quizzes.">
    <title>AsasJepun - Learn Japanese from Scratch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="dark-theme">
    <!-- App Layout Container -->
    <div class="app-layout">
        <!-- Sidebar Navigation -->

                    <span class="logo-icon">あ</span>

                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#intro" class="nav-item active" data-target="intro">
                    <i data-lucide="home"></i>
                    <span data-i18n="nav.intro">Laman Utama</span>
                </a>
                <a href="#roadmap" class="nav-item" data-target="roadmap">
                    <i data-lucide="map"></i>
                    <span data-i18n="nav.roadmap">Laluan Pembelajaran</span>
                </a>

                <!-- Collapsible: Kana -->
                <div class="nav-group">
                    <a href="#kana" class="nav-item has-subnav" data-target="kana">
                        <i data-lucide="grid-3x3"></i>
                        <span data-i18n="nav.kana">Hiragana & Katakana</span>
                        <i data-lucide="chevron-right" class="subnav-arrow"></i>
                    </a>
                    <div class="nav-subitems hidden">
                        <a href="#kana/subpage1" class="nav-item subpage" data-target="kana/subpage1">
                            <i data-lucide="grid-3x3"></i>
                            <span>Subpage 1</span>
                        </a>
                    </div>
                </div>

                <!-- Collapsible: Kanji -->
                <div class="nav-group">
                    <a href="#kanji-rules" class="nav-item has-subnav" data-target="kanji-rules">
                        <i data-lucide="pen-tool"></i>
                        <span data-i18n="nav.kanjiRules">Kanji</span>
                        <i data-lucide="chevron-right" class="subnav-arrow"></i>
                    </a>
                    <div class="nav-subitems hidden">
                        <a href="#kanji-rules/subpage1" class="nav-item subpage" data-target="kanji-rules/subpage1">
                            <i data-lucide="pen-tool"></i>
                            <span>Subpage 1</span>
                        </a>
                    </div>
                </div>

                <!-- Collapsible: Self Study -->
                <div class="nav-group">
                    <a href="#self-study" class="nav-item has-subnav" data-target="self-study">
                        <i data-lucide="graduation-cap"></i>
                        <span data-i18n="nav.selfStudy">Self Study Guide</span>
                        <i data-lucide="chevron-right" class="subnav-arrow"></i>
                    </a>
                    <div class="nav-subitems hidden">
                        <a href="#self-study/anki" class="nav-item subpage" data-target="self-study/anki">
                            <i data-lucide="layers"></i>
                            <span data-i18n="nav.anki">Anki & Vocab Mining</span>
                        </a>
                    </div>
                </div>

                <a href="#jlpt-info" class="nav-item" data-target="jlpt-info">
                    <i data-lucide="info"></i>
                    <span data-i18n="nav.jlptInfo">What is JLPT?</span>
                </a>
                <a href="#culture" class="nav-item" data-target="culture">
                    <i data-lucide="globe"></i>
                    <span data-i18n="nav.culture">Pelajaran Budaya</span>
                </a>
                <a href="#blog" class="nav-item" data-target="blog">
                    <i data-lucide="file-text"></i>
                    <span data-i18n="nav.blog">Blog</span>
                </a>
                <a href="#resources" class="nav-item" data-target="resources">
                    <i data-lucide="link"></i>
                    <span data-i18n="nav.resources">Sumber</span>
                </a>
                <a href="#about" class="nav-item" data-target="about">
                    <i data-lucide="user"></i>
                    <span data-i18n="nav.about">Tentang</span>
                </a>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <!-- Language Toggle -->
                <div class="sidebar-lang-toggle" id="sidebar-lang-toggle">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="my">MY</button>
                </div>
                <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark/light theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <span class="theme-text">Light Mode</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="app-main">
            <!-- Header Bar -->
            <header class="app-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
                        <i data-lucide="menu"></i>
                    </button>
                    <h2 class="current-section-title" id="section-title">Pengenalan</h2>
                </div>
                <div class="header-right">
                    <!-- Join Class Button -->
                    <button class="join-class-btn" id="join-class-btn" title="Join my class">
                        Nak kelas?
                    </button>
                    <!-- Ko-fi Button -->
                    <a href="https://ko-fi.com/uthmannn_" target="_blank" rel="noopener" class="kofi-btn" id="kofi-btn" title="Support on Ko-fi">
                        <img src="logos/ko-fi-logotype-27349_512.png" alt="Ko-fi" width="18" height="18">
                        <span>Donate</span>
                    </a>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div class="app-body" id="app-view">
                <!-- Content gets dynamically injected here -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Class Signup Modal -->
    <div class="modal-overlay" id="signup-modal">
        <div class="modal-container signup-modal-container animate-scale">
            <button class="modal-close" id="signup-modal-close" aria-label="Close modal">
                <i data-lucide="x"></i>
            </button>
            <div class="signup-modal-body">
                <h2 class="signup-title">Nak kelas Jepun?</h2>
                <p class="signup-subtitle">Isi form ni, saya akan contact korang dalam 24 jam</p>
                <form id="signup-form" class="signup-form">
                    <div class="form-group">
                        <label for="signup-name">Nama <span class="required">*</span></label>
                        <input type="text" id="signup-name" name="name" required placeholder="Nama korang">
                    </div>
                    <div class="form-group">
                        <label for="signup-age">Umur <span class="required">*</span></label>
                        <input type="text" id="signup-age" name="age" required placeholder="Berapa umur?">
                    </div>
                    <div class="form-group">
                        <label for="signup-phone">No Telefon <span class="required">*</span></label>
                        <input type="tel" id="signup-phone" name="phone" required placeholder="012-345 6789">
                    </div>
                    <div class="form-group">
                        <label for="signup-class-type">Saya nak kelas <span class="required">*</span></label>
                        <select id="signup-class-type" name="classType" required>
                            <option value="">Pilih jenis kelas</option>
                            <option value="1on1">1 on 1 (RM200/bulan)</option>
                            <option value="group">Berkumpulan (RM150/bulan)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pilih hari dan masa yang available <span class="required">*</span></label>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Isnin-10am"> Isnin 10am</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Isnin-12pm"> Isnin 12pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Isnin-2pm"> Isnin 2pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Isnin-5pm"> Isnin 5pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Isnin-8pm"> Isnin 8pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Isnin-10pm"> Isnin 10pm</label>
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Selasa-10am"> Selasa 10am</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Selasa-12pm"> Selasa 12pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Selasa-2pm"> Selasa 2pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Selasa-5pm"> Selasa 5pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Selasa-8pm"> Selasa 8pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Selasa-10pm"> Selasa 10pm</label>
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Rabu-10am"> Rabu 10am</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Rabu-12pm"> Rabu 12pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Rabu-2pm"> Rabu 2pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Rabu-5pm"> Rabu 5pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Rabu-8pm"> Rabu 8pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Rabu-10pm"> Rabu 10pm</label>
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Khamis-10am"> Khamis 10am</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Khamis-12pm"> Khamis 12pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Khamis-2pm"> Khamis 2pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Khamis-5pm"> Khamis 5pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Khamis-8pm"> Khamis 8pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Khamis-10pm"> Khamis 10pm</label>
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Sabtu-10am"> Sabtu 10am</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Sabtu-12pm"> Sabtu 12pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Sabtu-2pm"> Sabtu 2pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Sabtu-5pm"> Sabtu 5pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Sabtu-8pm"> Sabtu 8pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Sabtu-10pm"> Sabtu 10pm</label>
                        </div>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Ahad-10am"> Ahad 10am</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Ahad-12pm"> Ahad 12pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Ahad-2pm"> Ahad 2pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Ahad-5pm"> Ahad 5pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Ahad-8pm"> Ahad 8pm</label>
                            <label class="checkbox-label"><input type="checkbox" name="schedule" value="Ahad-10pm"> Ahad 10pm</label>
                        </div>
                    </div>
                    <button type="submit" class="signup-submit-btn">Hantar</button>
                </form>
                <p class="signup-note">* Required fields</p>
            </div>
        </div>
    </div>

    <!-- Script Imports -->
    <script type="module" src="app.js"></script>
</body>
</html>
